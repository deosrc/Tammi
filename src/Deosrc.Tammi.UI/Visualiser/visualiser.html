<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Visualiser</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b0d; }
  canvas { display: block; width: 100%; height: 100%; }
  /* Tooltips are dark glass: the page shows through them, and the hovered thing's colour glows at the edge. */
  #tip {
    position: fixed; left: 0; top: 0; z-index: 1; max-width: 260px; padding: 7px 10px;
    border: 1px solid color-mix(in srgb, var(--c, #8a6cf0) 55%, transparent); border-radius: 8px;
    background: rgba(11, 11, 13, 0.62); backdrop-filter: blur(6px);
    box-shadow: 0 0 14px color-mix(in srgb, var(--c, #8a6cf0) 35%, transparent);
    color: #cfd2d6; font: 12px/1.4 system-ui, sans-serif; pointer-events: none;
    opacity: 0; transition: opacity 0.15s;
  }
  #tip.shown { opacity: 1; }
  #tip b { display: block; color: #fff; font-weight: 600; }
  #tip span { color: #8b9097; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="tip"></div>
<script>
// A proof-of-concept visualiser. Workspaces are glowing nodes, grouped around their task source. Each agent orbits its
// workspace and throws off particles: lots when it's working, a slow pulse when it needs the user, a few when idle.
// Each frame fades the last one instead of clearing it, which leaves the trails.

const states = {
  Working: { rate: 6, speed: 1.6, pulse: false },
  NeedsInput: { rate: 0.5, speed: 0.4, pulse: true },
  Error: { rate: 2, speed: 2.2, pulse: false },
  Running: { rate: 0.3, speed: 0.3, pulse: false },
  Idle: { rate: 0.2, speed: 0.25, pulse: false },
  Exited: { rate: 0.05, speed: 0.15, pulse: false },
};

function create(canvas) {
  const context = canvas.getContext("2d");
  const colours = {
    agent: "#d97757",
    jira: "#4c9aff",
    other: "#8a6cf0",
    NeedsInput: "#d29922",
    Error: "#ff7b72",
  };

  let workspaces = [];
  let particles = [];
  let width = 0;
  let height = 0;
  let frame = 0;
  let time = 0;
  let last = performance.now();
  let pointer = null;
  let hoverKey = null;

  const tip = document.getElementById("tip");
  canvas.addEventListener("pointermove", (e) => (pointer = { x: e.clientX, y: e.clientY }));
  canvas.addEventListener("pointerleave", () => (pointer = null));

  const resize = () => {
    const ratio = window.devicePixelRatio || 1;
    width = canvas.clientWidth;
    height = canvas.clientHeight;
    canvas.width = width * ratio;
    canvas.height = height * ratio;
    context.setTransform(ratio, 0, 0, ratio, 0, 0);
    context.fillStyle = "#0b0b0d";
    context.fillRect(0, 0, width, height);
  };
  // On a resize the canvas is redrawn at its new size and the nodes move to their places in it.
  const observer = new ResizeObserver(() => {
    resize();
    layout();
  });
  observer.observe(canvas);
  resize();

  const sourceColour = (source) => (source === "jira" ? colours.jira : colours.other);
  const agentColour = (state) => colours[state] ?? colours.agent;

  // Sources sit on a ring, and a source's workspaces on a smaller ring around it, so spacing follows the grouping.
  const layout = () => {
    const sources = [...new Set(workspaces.map((w) => w.source))];
    const radius = Math.min(width, height) * (sources.length > 1 ? 0.28 : 0);
    sources.forEach((source, s) => {
      const angle = (s / sources.length) * Math.PI * 2;
      const cx = width / 2 + Math.cos(angle) * radius;
      const cy = height / 2 + Math.sin(angle) * radius;
      const group = workspaces.filter((w) => w.source === source);
      const inner = group.length > 1 ? Math.min(width, height) * 0.12 : 0;
      group.forEach((w, i) => {
        const a = (i / group.length) * Math.PI * 2 + angle;
        w.tx = cx + Math.cos(a) * inner;
        w.ty = cy + Math.sin(a) * inner;
      });
    });
  };

  const update = (nodes) => {
    workspaces = nodes.map((node) => {
      const old = workspaces.find((w) => w.id === node.id);
      return { ...node, x: old?.x ?? width / 2, y: old?.y ?? height / 2, tx: 0, ty: 0, phase: old?.phase ?? Math.random() * 6 };
    });
    layout();
  };

  const stateText = (state) => (state === "NeedsInput" ? "needs input" : state.toLowerCase());

  // The agent under the pointer, else the workspace: what it is, in text, and the colour it glows.
  const findHover = () => {
    if (!pointer) return null;
    const near = (x, y, r) => Math.hypot(pointer.x - x, pointer.y - y) <= r;
    for (const w of workspaces) {
      for (const agent of w.agents) {
        if (agent.ex !== undefined && near(agent.ex, agent.ey, 10)) {
          return {
            key: `${w.id}/${agent.id}`, x: agent.ex, y: agent.ey, r: 9, colour: agentColour(agent.state),
            title: agent.id, lines: [`Agent, ${stateText(agent.state)}`, `in ${w.name}`],
          };
        }
      }
    }
    for (const w of workspaces) {
      if (near(w.x, w.y, 40)) {
        const working = w.agents.filter((a) => a.state === "Working").length;
        const count = `${w.agents.length} agent${w.agents.length === 1 ? "" : "s"}`;
        return {
          key: w.id, x: w.x, y: w.y, r: 40, colour: sourceColour(w.source), title: w.name,
          lines: [
            w.source === "local" ? "No task source" : `Source: ${w.source}`,
            w.agents.length ? `${count}${working ? `, ${working} working` : ""}` : "No agents",
          ],
        };
      }
    }
    return null;
  };

  const showHover = (hover) => {
    if (!hover) {
      hoverKey = null;
      tip.classList.remove("shown");
      return;
    }
    if (hover.key !== hoverKey) {
      hoverKey = hover.key;
      tip.replaceChildren();
      const title = document.createElement("b");
      title.textContent = hover.title;
      tip.append(title);
      for (const line of hover.lines) {
        const row = document.createElement("span");
        row.textContent = line;
        tip.append(row, document.createElement("br"));
      }
      tip.lastChild.remove();
      tip.style.setProperty("--c", hover.colour);
      tip.classList.add("shown");
    }

    // Beside the pointer, kept inside the window.
    const x = Math.min(pointer.x + 16, width - tip.offsetWidth - 8);
    const y = Math.min(pointer.y + 16, height - tip.offsetHeight - 8);
    tip.style.transform = `translate(${Math.max(x, 8)}px, ${Math.max(y, 8)}px)`;

    // A soft ring round what's hovered.
    context.strokeStyle = hover.colour + "aa";
    context.lineWidth = 1.5;
    context.beginPath();
    context.arc(hover.x, hover.y, hover.r, 0, Math.PI * 2);
    context.stroke();
  };

  const step = (now) => {
    frame = requestAnimationFrame(step);
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    time += dt;

    // Fade the last frame rather than clearing it.
    context.globalCompositeOperation = "source-over";
    context.fillStyle = "rgba(11, 11, 13, 0.14)";
    context.fillRect(0, 0, width, height);
    context.globalCompositeOperation = "lighter";

    for (const w of workspaces) {
      w.x += (w.tx - w.x) * Math.min(dt * 2, 1);
      w.y += (w.ty - w.y) * Math.min(dt * 2, 1);

      const glow = context.createRadialGradient(w.x, w.y, 0, w.x, w.y, 40);
      glow.addColorStop(0, sourceColour(w.source) + "55");
      glow.addColorStop(1, "transparent");
      context.fillStyle = glow;
      context.beginPath();
      context.arc(w.x, w.y, 40, 0, Math.PI * 2);
      context.fill();

      w.agents.forEach((agent, i) => {
        const config = states[agent.state] ?? states.Running;
        const angle = time * 0.6 * (config.speed + 0.3) + w.phase + (i / w.agents.length) * Math.PI * 2;
        const ex = w.x + Math.cos(angle) * 34;
        const ey = w.y + Math.sin(angle) * 34;
        agent.ex = ex;
        agent.ey = ey;
        const colour = agentColour(agent.state);
        const rate = config.pulse ? config.rate + 6 * Math.max(0, Math.sin(time * 3)) ** 4 : config.rate;
        for (let n = rate * dt * 60 * 0.5 + Math.random(); n >= 1; n--) {
          const direction = Math.random() * Math.PI * 2;
          const speed = (0.3 + Math.random()) * config.speed * 60;
          particles.push({ x: ex, y: ey, vx: Math.cos(direction) * speed, vy: Math.sin(direction) * speed, life: 1, colour });
        }
        context.fillStyle = colour;
        context.beginPath();
        context.arc(ex, ey, 2.5, 0, Math.PI * 2);
        context.fill();
      });
    }

    particles = particles.filter((p) => p.life > 0).slice(-4000);
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt * 0.7;
      context.globalAlpha = Math.max(p.life, 0);
      context.fillStyle = p.colour;
      context.fillRect(p.x, p.y, 2, 2);
    }
    context.globalAlpha = 1;
    showHover(findHover());
  };
  frame = requestAnimationFrame(step);

  return {
    update,
  };
}

// The host sends each snapshot of the workspaces as JSON: Photino as a web message, MAUI by calling visualiserUpdate.
const visualiser = create(document.getElementById("canvas"));
window.visualiserUpdate = (nodes) => visualiser.update(typeof nodes === "string" ? JSON.parse(nodes) : nodes);
if (window.external && window.external.receiveMessage) {
  window.external.receiveMessage((message) => window.visualiserUpdate(message));
  // Tells Photino the page is ready for its first snapshot.
  window.external.sendMessage("ready");
}
</script>
</body>
</html>
